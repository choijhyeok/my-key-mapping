name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: python3 scripts/check.py
      - name: Build universal installer
        env:
          MYKEYMAPPING_BUILD: ${{ github.run_number }}
        run: |
          export MYKEYMAPPING_VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package-installer.py
          test "$(plutil -extract CFBundleShortVersionString raw dist/MyKeyMapping.app/Contents/Info.plist)" = "$MYKEYMAPPING_VERSION"
          codesign --verify --deep --strict dist/MyKeyMapping.app
          for executable in dist/MyKeyMapping.app/Contents/MacOS/MyKeyMapping dist/MyKeyMapping.app/Contents/Helpers/*/Contents/MacOS/*; do
            lipo "$executable" -verify_arch arm64 x86_64
          done
          pkgutil --payload-files dist/MyKeyMapping.pkg > dist/payload-files.txt
          grep -q 'MyKeyMapping.app/Contents/MacOS/MyKeyMapping$' dist/payload-files.txt
          grep -q 'MyKeyMapping.app/Contents/Helpers/PhraseTyper.app/Contents/MacOS/PhraseTyper$' dist/payload-files.txt
          grep -q 'MyKeyMapping.app/Contents/Helpers/PhraseSettings.app/Contents/MacOS/PhraseSettings$' dist/payload-files.txt
          grep -q 'MyKeyMapping.app/Contents/Resources/phrases.json$' dist/payload-files.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MyKeyMapping.pkg dist/MyKeyMapping.zip dist/SHA256SUMS.txt --verify-tag --title "MyKeyMapping ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
